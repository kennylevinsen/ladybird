<!DOCTYPE html>
<script src="../include.js"></script>
<script>
    asyncTest(async done => {
        const host = document.createElement("div");
        host.style.cssText = "width: 100px; height: 50px";
        const object = document.createElement("object");
        object.style.cssText = "display: block; width: 100%; height: 100%";
        object.type = "text/html";
        object.data = "about:blank";
        await new Promise(resolve => {
            object.onload = resolve;
            host.appendChild(object);
            document.body.appendChild(host);
        });
        const win = object.contentDocument.defaultView;
        println(`load: ${object.contentDocument.URL}`);
        win.addEventListener("resize", () => {
            println(`resize: ${win.innerWidth}x${win.innerHeight}`);
            done();
        }, { once: true });
        host.style.height = "80px";
    });
</script>
